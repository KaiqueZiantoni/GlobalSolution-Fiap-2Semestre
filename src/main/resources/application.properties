spring.application.name=tomei-doutor-api

# Porta: o Render informa a porta na variavel PORT. Fora dele, 8080.
server.port=${PORT:8080}

# Oracle da FIAP. Os valores vem SOMENTE de variaveis de ambiente.
# Nao ha valor padrao: sem as tres variaveis a aplicacao nao sobe.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno: o Oracle da FIAP limita as sessoes por usuario.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
# Banco que nao responde: desiste em vez de deixar a requisicao pendurada.
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties[oracle.net.CONNECT_TIMEOUT]=10000
spring.datasource.hikari.data-source-properties[oracle.jdbc.ReadTimeout]=30000

# A API nao serve arquivo estatico: rota desconhecida vira 404 em JSON no handler.
spring.web.resources.add-mappings=false

# Datas em texto (2026-11-18 e 2026-11-18T08:00:00), nunca em vetor de numeros.
spring.jackson.serialization.write-dates-as-timestamps=false
