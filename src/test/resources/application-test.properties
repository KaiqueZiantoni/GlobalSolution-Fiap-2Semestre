# Perfil dos testes automatizados: H2 em memoria, no modo de compatibilidade com Oracle.
# Nenhum teste toca o Oracle da FIAP.
spring.datasource.url=jdbc:h2:mem:tomeidoutor;MODE=Oracle;DB_CLOSE_DELAY=-1;IGNORE_UNKNOWN_SETTINGS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
